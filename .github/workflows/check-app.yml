name: HEC TECH development checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/in-app-tool-manuals
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app scripts and offline assets
        run: node tests/check-categories.cjs && node tests/check-backup-panels.cjs && node tests/check-drive-recovery.cjs && node tests/check-photo-save.cjs && node tests/check-portable-recovery.cjs && node tests/check-search.cjs && node tests/check-efficiency.cjs && node tests/check-photo-preview.cjs && node tests/check-barcode-flow.cjs && node tests/check-smart-add.cjs && node tests/check-lookup.cjs && node tests/check-app.cjs && node tests/check-drive-pdfs.cjs && node tests/check-receipts.cjs && node tests/check-service-worker.cjs

