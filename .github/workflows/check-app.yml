name: HEC TECH development checks
on:
  pull_request:
  push:
    branches:
      - feature/in-app-tool-manuals
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app scripts and offline assets
        run: node tests/check-app.cjs
