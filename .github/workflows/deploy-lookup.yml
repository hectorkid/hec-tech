name: Deploy HEC TECH product lookup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/product-lookup-worker.js'
      - 'wrangler.lookup.toml'
      - '.github/workflows/deploy-lookup.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy product lookup Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.lookup.toml
