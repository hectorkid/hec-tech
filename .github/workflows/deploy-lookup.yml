name: Deploy HEC TECH product lookup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/product-lookup-worker.js'
      - 'wrangler.lookup.toml'
      - '.github/workflows/deploy-lookup.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy product lookup Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.lookup.toml
      - name: Smoke test deployed lookup endpoint
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url='https://hec-tech-lookup.hectech.workers.dev/product-lookup?model=CF200D1625'
          request=urllib.request.Request(url,headers={'Origin':'https://hectorkid.github.io'})
          try:
              with urllib.request.urlopen(request,timeout=25) as response:
                  body=json.load(response)
                  print('HTTP:',response.status,'matches:',len(body.get('matches',[])))
                  assert isinstance(body.get('matches'),list),'Missing matches array'
          except urllib.error.HTTPError as e:
              print('HTTP:',e.code,'error:',e.read().decode('utf-8')[:500]);raise
          PY
